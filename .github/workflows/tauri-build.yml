name: Tauri desktop builds

on:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: windows-x64
            artifact-path: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
            tauri-args: ""
          - os: macos-latest
            artifact-name: macos-universal
            artifact-path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            tauri-args: --target universal-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install universal macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        run: yarn tauri build ${{ matrix.tauri-args }}

      - name: Upload installers
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: excalidraw-tauri-${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
